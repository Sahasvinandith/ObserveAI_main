# ─────────────────────────────────────────────────────────────────────────────
# ObserveAI — global-tracker Deployment + Service
#
# Singleton global person tracker service.
# Reads Re-ID features from reid_features (plain XREAD — must see every update).
# Reads identity assignments from identity_results (consumer group
# cg::global_tracker_identity).
# Exposes FastAPI HTTP API on port 8080:
#   GET /health          — liveness probe
#   GET /global_persons  — snapshot of all tracked persons
#   GET /global_persons/{id}
#
# Scaling policy: fixed at 1 replica (singleton — stateful in-process registry).
# GPU: not required.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: global-tracker
  namespace: observeai
  labels:
    app.kubernetes.io/name: global-tracker
    app.kubernetes.io/part-of: observeai
    app.kubernetes.io/component: tracking
spec:
  replicas: 1
  # Recreate: global person state is in-process; multiple replicas would diverge
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: global-tracker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: global-tracker
        app.kubernetes.io/part-of: observeai
    spec:
      containers:
        - name: global-tracker
          image: observeai/global-tracker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_URL
              value: "redis://redis.observeai.svc.cluster.local:6379"
            - name: HTTP_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "info"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: global-tracker
  namespace: observeai
  labels:
    app.kubernetes.io/name: global-tracker
    app.kubernetes.io/part-of: observeai
    app.kubernetes.io/component: tracking
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: global-tracker
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
