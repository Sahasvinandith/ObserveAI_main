  name: face-recog-worker-scaler
  namespace: observeai
  labels:
    app.kubernetes.io/name: face-recog-worker
    app.kubernetes.io/part-of: observeai
spec:
  scaleTargetRef:
    name: face-recog-worker
  minReplicaCount: 1
  maxReplicaCount: 4
  cooldownPeriod: 30
  triggers:
    - type: redis-streams
      metadata:
        address: redis.observeai.svc.cluster.local:6379
        stream: face_crops
        consumerGroup: "cg::face_recog"
        pendingEntriesCount: "20"

---
# ── face-db-writer ────────────────────────────────────────────────────────────
# Scales on identity_results lag for consumer group cg::face_db_writer.
# Higher threshold (30): disk I/O is bounded so more backlog is acceptable.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: face-db-writer-scaler
  namespace: observeai
  labels:
    app.kubernetes.io/name: face-db-writer
    app.kubernetes.io/part-of: observeai
spec:
  scaleTargetRef:
    name: face-db-writer
  minReplicaCount: 1
  maxReplicaCount: 3
  cooldownPeriod: 30
  triggers:
    - type: redis-streams
      metadata:
        address: redis.observeai.svc.cluster.local:6379
        stream: identity_results
        consumerGroup: "cg::face_db_writer"
        pendingEntriesCount: "30"

