# ─────────────────────────────────────────────────────────────────────────────
# ObserveAI — KEDA ScaledObjects for all autoscaled microservices
#
# KEDA must be installed in the cluster before applying these manifests:
#   kubectl apply -f https://github.com/kedacore/keda/releases/download/v2.13.1/keda-2.13.1.yaml
#
# Verify KEDA is ready:
#   kubectl get pods -n keda
#
# All ScaledObjects target the Redis Streams backend at:
#   redis.observeai.svc.cluster.local:6379
#
# Trigger type: redis-streams
#   pendingEntriesCount — number of messages pending acknowledgement in the
#   consumer group (i.e. delivered but not yet ACKed).  This is the correct
#   metric for backpressure-based autoscaling: it rises when workers fall
#   behind and falls as workers catch up.
#
# cooldownPeriod: 30 s — short cooldown keeps GPU pods responsive to bursts
#   without excessive scale-in/out churn at steady state.
# ─────────────────────────────────────────────────────────────────────────────

# ── person-yolo-worker ────────────────────────────────────────────────────────
# Scales on shared_raw_frames lag for consumer group cg::person_yolo.
# Threshold 30: each pod can process ~30 buffered frames before another is needed.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: person-yolo-worker-scaler
  namespace: observeai
  labels:
    app.kubernetes.io/name: person-yolo-worker
    app.kubernetes.io/part-of: observeai
spec:
  scaleTargetRef:
    name: person-yolo-worker
  minReplicaCount: 1
  maxReplicaCount: 4
  cooldownPeriod: 30
  triggers:
    - type: redis-streams
      metadata:
        address: redis.observeai.svc.cluster.local:6379
        stream: shared_raw_frames
        consumerGroup: cg::person_yolo
        pendingEntriesCount: "30"

---
# ── face-yolo-worker ──────────────────────────────────────────────────────────
# Scales on person_tracks::Front_Door lag for consumer group cg::face_yolo.
# Adjust stream name if you have multiple cameras — add one trigger per camera
# stream, or use a wildcard-capable KEDA plugin.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: face-yolo-worker-scaler
  namespace: observeai
  labels:
    app.kubernetes.io/name: face-yolo-worker
    app.kubernetes.io/part-of: observeai
spec:
  scaleTargetRef:
    name: face-yolo-worker
  minReplicaCount: 1
  maxReplicaCount: 4
  cooldownPeriod: 30
  triggers:
    - type: redis-streams
      metadata:
        address: redis.observeai.svc.cluster.local:6379
        stream: "person_tracks::Front_Door"
        consumerGroup: "cg::face_yolo"
        pendingEntriesCount: "20"

