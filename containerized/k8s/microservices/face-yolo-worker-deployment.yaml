# ─────────────────────────────────────────────────────────────────────────────
# ObserveAI — face-yolo-worker Deployment
#
# Reads confirmed person tracks from person_tracks::{camera} (consumer group
# cg::face_yolo), runs YOLOv11n-face detection on person crops, and publishes
# face crops to face_crops.
#
# Scaling policy: KEDA ScaledObject on person_tracks::* queue lag (see
# keda-scaledobjects.yaml).  Replicas: 1 (min) to 4 (max).
# GPU: 1 × NVIDIA GPU per pod.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: face-yolo-worker
  namespace: observeai
  labels:
    app.kubernetes.io/name: face-yolo-worker
    app.kubernetes.io/part-of: observeai
    app.kubernetes.io/component: ai-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: face-yolo-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: face-yolo-worker
        app.kubernetes.io/part-of: observeai
    spec:
      containers:
        - name: face-yolo-worker
          image: observeai/face-yolo-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_URL
              value: "redis://redis.observeai.svc.cluster.local:6379"
            - name: YOLO_MODEL_PATH
              value: "/app/yolo-weights/yolov11n-face.pt"
            - name: YOLO_CONFIG_DIR
              value: "/app/yolo-weights"
            # CAMERA_NAME: set to the camera this pod subscribes to.
            # When deploying a pool that subscribes to a single camera stream,
            # set this explicitly.  Multiple pods with the same CAMERA_NAME and
            # consumer group will correctly load-balance via Redis consumer groups.
            - name: CAMERA_NAME
              value: "Front_Door"
            - name: LOG_LEVEL
              value: "info"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "1"
              memory: "2Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: yolo-weights
              mountPath: /app/yolo-weights
              readOnly: true
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import redis, os; r=redis.from_url(os.environ['REDIS_URL']); r.ping()"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: yolo-weights
          persistentVolumeClaim:
            claimName: yolo-weights-pvc
