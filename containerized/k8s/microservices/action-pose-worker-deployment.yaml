# ─────────────────────────────────────────────────────────────────────────────
# ObserveAI — action-pose-worker Deployment
#
# Reads confirmed person tracks from person_tracks::{CAMERA_NAME} (consumer
# group cg::action_detect), runs YOLOv8n-pose estimation, compares keypoints
# against reference actions in /app/Actions_db/, and publishes matched actions
# to action_events.
#
# Scaling policy: KEDA ScaledObject on person_tracks::* queue lag (see
# keda-scaledobjects.yaml).  Replicas: 1 (min) to 4 (max).
# GPU: 1 × NVIDIA GPU per pod.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: action-pose-worker
  namespace: observeai
  labels:
    app.kubernetes.io/name: action-pose-worker
    app.kubernetes.io/part-of: observeai
    app.kubernetes.io/component: ai-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: action-pose-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: action-pose-worker
        app.kubernetes.io/part-of: observeai
    spec:
      containers:
        - name: action-pose-worker
          image: observeai/action-pose-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_URL
              value: "redis://redis.observeai.svc.cluster.local:6379"
            - name: CAMERA_NAME
              value: "Front_Door"
            - name: ACTIONS_DB_PATH
              value: "/app/Actions_db"
            - name: POSE_MODEL_PATH
              value: "/app/yolo-weights/yolov8n-pose.pt"
            - name: YOLO_CONFIG_DIR
              value: "/app/yolo-weights"
            - name: LOG_LEVEL
              value: "info"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "1"
              memory: "2Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: yolo-weights
              mountPath: /app/yolo-weights
              readOnly: true
            - name: actions-db
              mountPath: /app/Actions_db
              readOnly: true
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import redis, os; r=redis.from_url(os.environ['REDIS_URL']); r.ping()"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: yolo-weights
          persistentVolumeClaim:
            claimName: yolo-weights-pvc
        - name: actions-db
          persistentVolumeClaim:
            claimName: actions-db-pvc
