# ─────────────────────────────────────────────────────────────────────────────
# ObserveAI — person-yolo-worker Deployment
#
# Reads raw frames from shared_raw_frames (consumer group cg::person_yolo),
# runs YOLOv8n person detection, and publishes to person_detections::{camera}.
#
# Scaling policy: KEDA ScaledObject on shared_raw_frames queue lag (see
# keda-scaledobjects.yaml).  Replicas: 1 (min) to 4 (max).
# GPU: 1 × NVIDIA GPU per pod.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: person-yolo-worker
  namespace: observeai
  labels:
    app.kubernetes.io/name: person-yolo-worker
    app.kubernetes.io/part-of: observeai
    app.kubernetes.io/component: ai-inference
spec:
  # Initial replica count — KEDA ScaledObject overrides this at runtime
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: person-yolo-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: person-yolo-worker
        app.kubernetes.io/part-of: observeai
    spec:
      containers:
        - name: person-yolo-worker
          image: observeai/person-yolo-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_URL
              value: "redis://redis.observeai.svc.cluster.local:6379"
            - name: YOLO_MODEL_PATH
              value: "/app/yolo-weights/yolov8n.pt"
            - name: YOLO_CONFIG_DIR
              value: "/app/yolo-weights"
            - name: LOG_LEVEL
              value: "info"
            # POD_NAME: injected via Downward API so each replica has a unique consumer name
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: yolo-weights
              mountPath: /app/yolo-weights
              readOnly: true
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import redis, os; r=redis.from_url(os.environ['REDIS_URL']); r.ping()"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: yolo-weights
          persistentVolumeClaim:
            claimName: yolo-weights-pvc
