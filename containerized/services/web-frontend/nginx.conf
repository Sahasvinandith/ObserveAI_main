# ─────────────────────────────────────────────────────────────────────────────
# ObserveAI — Nginx reverse proxy + SPA config
#
# This config:
#   - Proxies /api/* to the ai-backend FastAPI service
#   - Proxies /ws/*  to the ai-backend WebSocket endpoint
#   - Serves the React SPA for all other routes (SPA fallback)
#   - Streams MJPEG video without buffering
# ─────────────────────────────────────────────────────────────────────────────

upstream ai_backend {
    # Docker Compose service name resolves via Docker's internal DNS
    server ai-backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ── Static React SPA ─────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-hashed assets with long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ── MJPEG streaming — disable all buffering ───────────────────────────
        # Camera streams are multipart/x-mixed-replace; buffering breaks them.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;   # 1 hour — keep MJPEG streams alive
        proxy_send_timeout 3600s;
    }

    # ── WebSocket proxy ───────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── SPA fallback — React Router client-side routing ───────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/x-javascript text/xml
               application/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;
}
